<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>开放能力与安全边界</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet"/><link rel="stylesheet" href="../styles.css"/></head><body><div class="grain"></div><main class="article-wrap"><p class="meta">2026-02-28 · SECURITY</p><h1>开放能力与安全边界，怎么平衡</h1><p>可用性和安全不是对立关系。真正成熟的系统，会用最小权限、可审计和可撤回策略，把风险压在可控范围里。</p><p>先开能力，再补边界，往往会变成“边跑边漏”；先设计边界，再开能力，系统会更稳。</p><p class="article-nav"><a href="../posts.html">← 返回文章列表</a></p></main></body></html>
